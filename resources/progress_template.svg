<svg xmlns="http://www.w3.org/2000/svg" width="350" height="350"><defs><clipPath id="progressClip"><rect width="296" height="25" x="27" y="277.5"/></clipPath></defs><text x="80" y="40" font-size="40">TH06.EXE</text><image width="150" x="105" y="55" href="{ICON_URL}"/><text xml:space="preserve"><tspan x="80" y="240">Implemented: {FUNC_PROG_PERCENT}%</tspan> <tspan x="80" y="260">Byte Accuracy: {BYTES_PROG_PERCENT}%</tspan></text><g width="300" height="20"><rect width="300" height="30" x="25" y="275" class="outer-rect"/><rect width="300" height="30" x="25" y="275" class="inner-rect"/><rect height="25" x="27" y="277.5" class="progress-rect"/><text xml:space="preserve"><tspan x="45%" y="296" class="progress-text">{FUNC_PROG_PERCENT}%</tspan></text><defs><filter id="blendMode"><feBlend in2="SourceGraphic" mode="difference"/></filter></defs><defs><linearGradient id="gradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="red"/><stop offset="100%" stop-color="#00f"/></linearGradient></defs></g><style>@import url(https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&amp;display=swap);:root{--text-color:{TEXT_COLOR};--percentage:{FUNC_PROG_PERCENT};--progress:calc(var(--percentage) * 3px);--outer-rect-width:300px}text{font-style:normal;font-variant:normal;font-family:&quot;Roboto Mono&quot;,monospace;text-align:start;text-anchor:start;fill:var(--text-color)}.outer-rect{display:inline;stroke:var(--text-color);stroke-width:3;stroke-dasharray:none;stroke-opacity:1;fill:none}.inner-rect{fill:#fff}.progress-rect{display:inline;width:var(--progress);clip-path:url(#progressClip);fill:#42ff75}.progress-text{fill:#000;font-weight:700}</style></svg>